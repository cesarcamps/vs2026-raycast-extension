name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build extension
        run: npx ray build --output visualstudio2026.raycast --environment dist --non-interactive

      - name: 📦 Package .raycast
        shell: pwsh
        run: Compress-Archive -Path visualstudio2026.raycast/* -DestinationPath visualstudio2026.raycast.zip

      - name: ⬆ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: visualstudio2026.raycast
          path: visualstudio2026.raycast.zip
          if-no-files-found: error

      - name: 🏷️ Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: visualstudio2026.raycast.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
